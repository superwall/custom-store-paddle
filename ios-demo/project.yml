name: PaddleDemo
options:
  bundleIdPrefix: com.superwall.demo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Superwall iOS SDK from the custom store checkout branch (unreleased; stacked on
# superwall/Superwall-iOS#552).
# To build against a local checkout instead, use project.local.yml (see README).
packages:
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS
    branch: feat/custom-store-sdk-checkout

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  PaddleDemo:
    type: application
    platform: iOS
    sources:
      - path: PaddleDemo
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superwall.demo.paddle
        PRODUCT_NAME: PaddleDemo
        INFOPLIST_FILE: PaddleDemo/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SuperwallKit

schemes:
  PaddleDemo:
    build:
      targets:
        PaddleDemo: all
    run:
      config: Debug
    archive:
      config: Release
